<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyFootball</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 400px;
        }
        .icon { font-size: 4rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #aaa; margin-bottom: 1.5rem; line-height: 1.5; }
        .note { font-size: 0.85rem; color: #666; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <!-- Squad invite content (shown for /myfootball/join/* URLs) -->
    <div id="squad-invite" class="card" style="display:none;">
        <div class="icon">⚽</div>
        <h1>You've been invited to a squad!</h1>
        <p>Open this link on your iPhone with MyFootball installed to join automatically.</p>
        <p class="note">Don't have MyFootball yet? It's coming soon to the App Store.</p>
    </div>

    <!-- Generic 404 (shown for everything else) -->
    <div id="not-found" class="card" style="display:none;">
        <div class="icon">⚽</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist.</p>
    </div>

    <script>
        var path = window.location.pathname;
        if (path.match(/^\/myfootball\/join\/.+/)) {
            document.getElementById('squad-invite').style.display = 'block';
            document.title = 'Join Squad — MyFootball';
        } else {
            document.getElementById('not-found').style.display = 'block';
        }
    </script>
</body>
</html>
