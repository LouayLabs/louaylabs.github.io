<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Squad — MyFootball</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 400px;
        }
        .icon { font-size: 4rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #aaa; margin-bottom: 2rem; line-height: 1.5; }
        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            background: #4361ee;
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
        }
        .btn:hover { background: #3a56d4; }
        .note { font-size: 0.85rem; color: #666; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">⚽</div>
        <h1>You've been invited to a squad!</h1>
        <p>Open this link on your iPhone with MyFootball installed to join automatically.</p>
        <p class="note">Don't have MyFootball yet? It's coming soon to the App Store.</p>
    </div>
</body>
</html>
